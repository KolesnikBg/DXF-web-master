version: "3.9"

services:
  backend:
    build: ./backend
    container_name: dxf-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - dxf-network

  frontend:
    build: ./frontend
    container_name: dxf-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dxf-network

networks:
  dxf-network:
    driver: bridge